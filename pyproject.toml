[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qviz"
version = "0.1.0"
description = "Interactive Qiskit logical-to-physical circuit visualiser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "qiskit>=2.0",
  "qiskit-ibm-runtime>=0.40",
  "flask>=3.0",
  "matplotlib>=3.8",
  "pylatexenc>=2.10",
  "numpy",
  "rustworkx",
]

[project.scripts]
qviz = "qviz.cli:main"

[project.optional-dependencies]
notebook = [
  "ipython>=8.0",
  "jupyter>=1.0",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "twine>=5.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["qviz*"]

[tool.setuptools.package-data]
qviz = ["static/*"]
